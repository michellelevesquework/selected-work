<script>
(function() {
  const HASH = "3e6b6e77e9936a27550362531a746eefe4985108cf3ecc8f4fbf607be48dba01";
  const gate = document.getElementById("ml-gate");

  async function sha256(value) {
    const data = new TextEncoder().encode(value);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  document.getElementById("ml-gate-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const value = document.getElementById("ml-password").value;
    if (await sha256(value) === HASH) {
      gate.remove();
    } else {
      document.getElementById("ml-error").textContent = "That password doesn't match. Try again.";
    }
  });
})();
</script>
